name: Daily model update
on:
  schedule:
    - cron: "30 11 * * *"      # every day 11:30 UTC (7:30 am Eastern during daylight time)
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write            # lets the job commit the refreshed data and site files back to the repo
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py daily
      - name: Save results
        run: |
          git config user.name "tackle-bot"
          git config user.email "tackle-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push

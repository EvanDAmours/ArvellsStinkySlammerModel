name: Daily model update
on:
  schedule:
    - cron: "15 11 * * *"      # every day 11:15 UTC (5:15 am Edmonton in daylight time, 4:15 am in standard time); off the half hour so it never coincides with the line-pull job
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab
permissions:
  contents: write            # lets the job commit the refreshed data and site files back to the repo
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py daily
      - name: Save results
        run: |
          git config user.name "tackle-bot"
          git config user.email "tackle-bot@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%Y-%m-%d)"
          # Another job may have pushed meanwhile. Replay our commit on top, keeping our version of any generated
          # file both touched (ours is the fresher one), and retry the push a few times.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done

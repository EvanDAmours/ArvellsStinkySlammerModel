name: Pull tackle lines
# Pull slots are defined in Edmonton local time in run.py (PULL_SLOTS), so the clock change needs no edits here.
on:
  schedule:
    - cron: "7,37 * * * *"     # twice an hour; run.py decides whether a pull slot (Edmonton time) or a pre-kickoff pull is
                               # due and does nothing otherwise. Off the hour and half hour: GitHub delays runs queued at
                               # those minutes most (its own advice), and that is when the 2026-10-31 stall happened.
    - cron: "22,52 * * * *"    # a second schedule between them. Slots are served once, so a stalled schedule is covered
                               # by the other and nothing is pulled twice.
  workflow_dispatch:
    inputs:
      hours:
        description: "Only games starting within this many hours (blank = choose from the day and time)"
        required: false
        default: ""
permissions:
  contents: write
  actions: write             # lets a pull switch the daily schedule back on if GitHub has turned it off
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Must be an Actions secret (Settings -> Secrets and variables -> Actions).
      # Codespaces secrets are a separate store and are not visible to workflows.
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}   # lets a pull read the sealed meta written by the morning run
      SITE_PASSWORDS: ${{ secrets.SITE_PASSWORDS }}
      PARLAY_API_KEY: ${{ secrets.PARLAY_API_KEY }}   # optional second key; credits are pooled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ -n "${{ github.event.inputs.hours }}" ]; then python run.py odds --hours "${{ github.event.inputs.hours }}"; else python run.py odds --auto; fi
      - name: Seal the site behind the shared password (without a password secret the site stays open)
        id: seal
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          SITE_PASSWORDS: ${{ secrets.SITE_PASSWORDS }}
        run: python run.py seal
      - name: Save results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "tackle-bot"
          git config user.email "tackle-bot@users.noreply.github.com"
          if [ "${{ steps.seal.outcome }}" = "failure" ]; then
            echo "sealing failed: the site files are not published unsealed"; git checkout -- docs/data && git clean -fdq docs/data
          fi
          git add data docs/data
          # A pull that found lines also makes sure the daily schedule is still switched on (see keepalive.yml).
          git diff --cached --quiet || { git commit -m "Lines $(date -u +%Y-%m-%dT%H:%M)"; gh workflow enable daily.yml || true; }
          # Another job may have pushed meanwhile. Replay our commit on top, keeping our version of any generated
          # file both touched (ours is the fresher one), and retry the push a few times.
          for i in 1 2 3 4; do
            git pull --rebase -X theirs && git push && break
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done

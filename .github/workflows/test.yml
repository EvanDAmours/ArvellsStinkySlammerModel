name: Test
on:
  push:
    paths: ["pipeline/**", "run.py", "config.py", "tests/**", "tools/**", "requirements.txt", ".github/workflows/**", "docs/index.html", "docs/nhl.html"]
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Smoke test (also writes the synthetic site the browser test opens)
        run: SMOKE_SITE_OUT="$RUNNER_TEMP/site" python tests/smoke_test.py
      - name: Browser test (every tab at a phone's width and a computer's)
        run: |
          pip install -r tests/requirements-browser.txt
          python -m playwright install --with-deps chromium
          python tests/browser_test.py "$RUNNER_TEMP/site"

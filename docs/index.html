<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arvell's Stinky Slammer Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f4; --panel: #ffffff; --ink: #13202e; --muted: #5b6b7b; --line: #d3dae1;
  --flag: #f2b705; --over: #2f7d4f; --under: #b23a48; --warn-bg: #fff4d6;

  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1621; --panel: #152130; --ink: #e6edf3; --muted: #93a4b5; --line: #26364a;
          --over: #5cc48a; --under: #f07b8a; --warn-bg: #3a2f10; color-scheme: dark; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans);

.wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
header h1 { font: 700 2.25rem/1.05 var(--cond); margin: 0; letter-spacing: 0.01em; }
.meta { color: var(--muted); font-size: 0.9rem; margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 16px; }
.warn { background: var(--warn-bg); border-left: 4px solid var(--flag); padding: 10px 12px; margin: 14px 0 0; border-radius: 4px; }

             padding: 8px 12px; cursor: pointer; white-space: nowrap; }
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 12px; font-size: 0.95rem; }
.controls label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }

.grade.A { background: #1f8a4c; } .grade.B { background: #c98a1b; } .grade.C { background: #8a8f98; }

.w { color: #1f8a4c; } .l { color: #c0392b; } .pos { color: #1f8a4c; } .neg { color: #c0392b; }

.toolbar select { font: inherit; padding: 2px 6px; }

.play { grid-template-columns: 1fr auto; }

.play .log { font-variant-numeric: tabular-nums; }

#gate[hidden] { display: none; }

.gate-box h2 { margin: 0; font: 700 1.3rem/1.2 var(--cond); } .gate-box p { margin: 0; color: var(--muted); font-size: 0.92rem; }

@media (max-width: 640px) { .play { grid-template-columns: 1fr; } .play .ev { grid-row: auto; grid-column: 1; text-align: left; } .play .ev b { display: inline; font-size: 1.3rem; margin-right: 6px; } .play .why-box { grid-column: 1; } .toolbar { position: static; } }

.ph > summary::-webkit-details-marker { display: none; }

.legend { border: 1px solid var(--line, #cfd4dc); border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; font-size: 0.92rem; }
.legend summary { cursor: pointer; font: 700 1rem/1.4 var(--cond); }
.legend table { margin: 8px 0; } .legend td, .legend th { padding: 4px 10px 4px 0; }
.legend p { margin: 6px 0; color: var(--muted); }
.five-box { border: 2px solid #1f8a4c; border-radius: 10px; padding: 10px 12px 2px; margin: 0 0 16px; }
.five-box h3 { margin: 0 0 6px; font: 700 1.1rem/1.2 var(--cond); }
.five-box .note { margin: 0 0 8px; }
.play.five { border-left: 4px solid #1f8a4c; }
.play .actions { grid-column: 2; justify-self: end; display: flex; gap: 6px; align-items: center; }
.bet-link { font: 600 0.8rem var(--cond); padding: 3px 9px; border: 1px solid #2c5aa0; border-radius: 999px; color: #2c5aa0; text-decoration: none; white-space: nowrap; }
.bet-link:hover { background: #2c5aa0; color: #fff; }
.parlay-box .tail, #mine-body .tail { margin: 6px 0 10px; font-size: 0.9rem; color: var(--muted); } .tail a { margin-right: 8px; }
.play .add { justify-self: end; font: 600 0.8rem var(--cond); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; }
.play .add.on, #mine-body .add.on { background: #1f8a4c; color: #fff; border-color: #1f8a4c; }
#mine-body .add { font: 600 0.8rem var(--cond); padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; margin: 2px 6px 2px 0; }
#mine-body input[type=search] { font: inherit; padding: 6px 10px; width: min(100%, 320px); margin: 4px 0 8px; }
.mine-bar { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0 0 12px; font-variant-numeric: tabular-nums; }
.mine-bar b { font: 700 1.4rem/1.1 var(--cond); display: block; } .mine-bar span { color: var(--muted); font-size: 0.85rem; }
.live { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 0 0 10px; }
.live.good { border-left-color: #1f8a4c; } .live.bad { border-left-color: #c0392b; } .live.done { opacity: 0.85; }
.live .who { font-weight: 600; } .live .who small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.live .now { grid-row: 1 / span 3; grid-column: 2; text-align: right; align-self: center; }
.live .now b { display: block; font: 700 1.9rem/1 var(--cond); font-variant-numeric: tabular-nums; } .live .now span { font-size: 0.8rem; color: var(--muted); }
.live .bet { font: 600 1.05rem var(--cond); } .live .bet .over { color: var(--over); } .live .bet .under { color: var(--under); }
.live .trend { color: var(--muted); font-size: 0.9rem; } .live .trend b.ok { color: #1f8a4c; } .live .trend b.no { color: #c0392b; }
.live .stake { grid-column: 1 / -1; font-size: 0.9rem; color: var(--muted); } .live .stake input { font: inherit; width: 6em; padding: 2px 6px; } .live .stake b.ok { color: #1f8a4c; } .live .stake b.no { color: #c0392b; }
.mine-h { font: 700 1.05rem/1.2 var(--cond); margin: 18px 0 8px; } .mine-h small { font: 400 0.85rem var(--sans, inherit); color: var(--muted); }
.live .trend b { font-size: 0.95rem; }
.live .rm { grid-column: 1 / -1; justify-self: start; font-size: 0.8rem; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline; }
@media (max-width: 640px) { .live { grid-template-columns: 1fr; } .live .now { grid-row: auto; grid-column: 1; text-align: left; } .live .now b { display: inline; font-size: 1.3rem; margin-right: 6px; } .play .actions { grid-column: 1; justify-self: start; } }
[hidden] { display: none !important; }
.daybar button { padding: 6px 12px; border: 1px solid var(--line, #cfd4dc); background: transparent; border-radius: 8px; margin-right: 4px; cursor: pointer; font: inherit; color: var(--ink); }
.daybar button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.daybar button:disabled { opacity: 0.35; cursor: not-allowed; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 6px; background: #8a8f98; color: #fff; font-size: 0.75rem; margin-left: 6px; vertical-align: middle; }
.tag.ok { background: #1f8a4c; } .tag.warn { background: #c0392b; }
.intl { display: inline-block; padding: 1px 6px; border-radius: 6px; background: #2c5aa0; color: #fff; font-size: 0.75rem; margin-left: 6px; vertical-align: middle; }

.parlay-box h3 { margin: 0 0 4px; font: 700 1.1rem/1.2 var(--cond); }

.parlay-box .terms b { font: 700 1.25rem/1.1 var(--cond); display: block; }
.parlay-box .terms span { color: var(--muted); font-size: 0.85rem; }
.parlay-box ol { margin: 0 0 4px 1.2em; padding: 0; } .parlay-box li { margin: 2px 0; }
.parlay-box .placed { color: var(--muted); font-size: 0.85rem; }

.play .ev span { font-size: 0.8rem; color: var(--muted); }
.play .why { grid-column: 1 / -1; color: var(--muted); font-size: 0.9rem; }

<body>
<div class="wrap">
  <header>
    <h1 id="title">Tackle board</h1>
    <div class="meta" id="meta"></div>
    <div id="warnings"></div>
  </header>
  <nav role="tablist" aria-label="Sections">
    <button role="tab" data-tab="plays" aria-selected="true">Plays</button>
    <button role="tab" data-tab="proj" aria-selected="false">Projections</button>
    <button role="tab" data-tab="record" aria-selected="false">Track record</button>
    <button role="tab" data-tab="check" aria-selected="false">Model check</button>
    <button role="tab" data-tab="mine" aria-selected="false">My board</button>
  </nav>

  <section id="plays">
    <div id="plays-top"></div>
    <div class="controls toolbar" id="plays-controls">
      <label>Position <select id="pos"><option value="">All</option><option value="LB">Linebackers</option><option value="S">Safeties</option><option value="CB">Corners</option><option value="DL">Defensive line</option></select></label>
      <label>Side <select id="side"><option value="">Both</option><option value="Under">Unders</option><option value="Over">Overs</option></select></label>
      <label>Book <select id="book"><option value="">Any book</option></select></label>
      <label>Market <select id="market"><option value="">Both</option><option value="player_tackles_assists">Tackles + assists</option><option value="player_solo_tackles">Solo tackles</option></select></label>
      <label>Slate <select id="slate"><option value="">All games</option><option value="early">Early (noon)</option><option value="late">Afternoon</option><option value="prime">Prime time</option></select></label>
      <label>Sort <select id="sort"><option value="lock">Lock score</option><option value="ev">Expected return</option><option value="kick">Kickoff</option><option value="player">Player</option><option value="line">Line</option></select></label>
      <label><input type="checkbox" id="picks-only" checked> Picks only</label>
      <label><input type="checkbox" id="best-only" checked> Best price per line</label>
    </div>
    <div id="plays-list"></div>
  </section>

  <section id="proj" hidden>
    <p class="note">Projected tackles for every defender playing this week. The fair line is the half-point line the model puts closest to a coin flip. Stat crew is the home scorekeepers’ effect on combined tackles.</p>
    <div class="controls"><input type="search" id="q" placeholder="Search player or team" aria-label="Search player or team">
      <span class="daybar" id="daybar" role="group" aria-label="Game day"></span>
      <label id="proj-slate-label" hidden>Sunday slate <select id="proj-slate"><option value="">All Sunday games</option><option value="early">Early (11 am)</option><option value="late">Afternoon (2 pm)</option><option value="prime">Prime time</option></select></label></div>
    <div class="scroll"><table id="proj-table"></table></div>
  </section>

  <section id="record" hidden>
    <div id="record-body"></div>
  </section>

  <section id="check" hidden>
    <div id="check-body"></div>
  </section>

  <section id="mine" hidden>
    <div id="mine-body"></div>
  </section>
</div>

<script>
const $ = (s) => document.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) { if (v === undefined || v === null || v === false) continue; k === "class" ? (e.className = v) : e.setAttribute(k, v); }
  for (const kid of kids) e.append(kid instanceof Node ? kid : document.createTextNode(kid ?? ""));
  return e;
};
const pct = (x, d = 0) => (x == null ? "" : (x * 100).toFixed(d) + "%");

const toDec = (a) => (a == null ? null : a > 0 ? 1 + a / 100 : 1 + 100 / Math.abs(a));
const num = (x, d = 1) => (x == null || Number.isNaN(x) ? "" : Number(x).toFixed(d));
const odds = (a) => (a == null ? "" : (a > 0 ? "+" : "") + Math.round(a));
const wl = (w, l, p) => el("b", {}, el("span", { class: "w" }, String(w ?? 0)), "-", el("span", { class: "l" }, String(l ?? 0)), p ? `-${p}` : "");
const units = (u, d = 1) => (u == null ? el("b", {}) : el("b", { class: u >= 0 ? "pos" : "neg" }, (u >= 0 ? "+" : "") + Number(u).toFixed(d)));

function recordsBar(s) {
  // Locks and plays records side by side, plus the replayed record under the current rules

// ---------------------------------------------------------------- the gate: sealed data files need the shared password
const KEYS = {};   // derived key per salt, so one password derivation serves every file of a sealing run
const GATE = { pw: null };
try { GATE.pw = localStorage.getItem("site-pw"); } catch (e) { /* storage off: asked every visit */ }
const b64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
async function keyFor(pw, saltB64, iter) {
  const id = `${pw}|${saltB64}|${iter}`;   // a wrong password must not leave its key behind for the right one
  if (!KEYS[id]) {
    const raw = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    KEYS[id] = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(saltB64), iterations: iter, hash: "SHA-256" }, raw, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

}
async function unseal(blob, pw) {
  if (blob.v === 1) {
    const key = await keyFor(pw, blob.salt, blob.iter || 200000);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, key, b64(blob.ct))));
  }
  // several passwords: the data key is wrapped once per password; the first wrapping this password opens is the one
  for (const k of blob.keys || []) {
    try {
      const wrapKey = await keyFor(pw, k.salt, blob.iter || 200000);
      const raw = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(k.iv) }, wrapKey, b64(k.wk));
      const dataKey = await crypto.subtle.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
      return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(blob.iv) }, dataKey, b64(blob.ct))));
    } catch (e) { /* not this entry */ }
  }
  throw new Error("no key entry opens with this password");
}
function askPassword(wrong) {
  // a full-screen gate; resolves with the password typed (kept on this device once a file decrypts with it)
  return new Promise((resolve) => {
    let g = $("#gate");
    if (!g) {
      g = el("div", { id: "gate" }, el("form", { class: "gate-box" }, el("h2", {}, "Arvell's Stinky Slammer Model"), el("p", {}, "This board is private. Enter the password you were given; this device remembers it."),
        el("input", { type: "password", id: "gate-pw", autocomplete: "current-password", "aria-label": "Password", autofocus: "" }), el("div", { class: "gate-err", id: "gate-err" }), el("button", { type: "submit" }, "Open the board")));
      document.body.append(g);
    }
    $("#gate-err").textContent = wrong ? "That password did not open the board. Try again." : "";
    g.hidden = false; $("#gate-pw").value = ""; $("#gate-pw").focus();
    g.querySelector("form").onsubmit = (e) => { e.preventDefault(); const v = $("#gate-pw").value; if (v) resolve(v); };
  });
}
// every data file loads at once, so one prompt serves all of them: callers share the pending prompt
function getPassword(wrong) {
  if (!GATE.pending) GATE.pending = askPassword(wrong).then((v) => { GATE.pending = null; return v; });
  return GATE.pending;
}
async function unlock(blob) {
  let wrong = false;
  for (;;) {
    const pw = GATE.pw || await getPassword(wrong);
    try {
      const out = await unseal(blob, pw);
      GATE.pw = pw;
      try { localStorage.setItem("site-pw", pw); } catch (err) { /* fine */ }
      const g = $("#gate"); if (g) g.hidden = true;
      return out;
    } catch (err) {
      if (GATE.pw === pw) { GATE.pw = null; try { localStorage.removeItem("site-pw"); } catch (e2) { /* fine */ } }
      wrong = true;
    }
  }
}
async function load(name) {
  try {
    const r = await fetch(`data/${name}.json`, { cache: "no-store" });
    if (r.ok) return await r.json();
    const e = await fetch(`data/${name}.json.enc`, { cache: "no-store" });
    if (!e.ok) return null;
    return await unlock(await e.json());
  } catch { return null; }
}
function lockSite() { try { localStorage.removeItem("site-pw"); } catch (e) { /* fine */ } location.reload(); }

let DATA = {};

// the pull ticker: today's and the coming days' line pulls, which ran, which are next, which are late
function renderPulls(m) {
  const box = $("#pulls"); if (!box) return; box.replaceChildren();
  const list = m.pull_schedule || []; if (!list.length) return;
  const now = Date.now(), fmtDay = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, weekday: "short" }).format(new Date(iso));
  const fmtT = (iso) => new Intl.DateTimeFormat("en-CA", { timeZone: TZ, hour: "numeric", minute: "2-digit" }).format(new Date(iso)).replace(":00", "").replace(" a.m.", " am").replace(" p.m.", " pm");
  const today = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
  // today's pulls, plus the next game day's if today's are all done
  const days = [...new Set(list.map((s) => s.day))];
  const upcomingDay = days.find((d) => d > today && list.some((s) => s.day === d));
  const showDays = [today, ...(list.filter((s) => s.day === today).every((s) => new Date(s.at).getTime() < now) && upcomingDay ? [upcomingDay] : [])];
  const nextAt = list.filter((s) => s.status === "upcoming" || s.status === "due").map((s) => new Date(s.at).getTime()).filter((t) => t > now - 45 * 60000).sort((a, b) => a - b)[0];
  box.append(el("span", {}, "Line pulls:"));
  for (const d of showDays) {
    const rows = list.filter((s) => s.day === d); if (!rows.length) continue;
    box.append(el("span", { class: "day" }, d === today ? "Today" : fmtDay(rows[0].at)));
    for (const s of rows) {
      const t = new Date(s.at).getTime();
      let cls = "", label = fmtT(s.at), title = s.kind === "prekick" ? "An hour before kickoff" : "Scheduled look";
      if (s.status === "pulled") { cls = "pulled"; label += " ✓"; title += ` · pulled ${fmtT(s.pulled_at)}${s.games != null ? `, ${s.games} game${s.games === 1 ? "" : "s"}` : ""}`; }
      else if (s.status === "skipped") { cls = "skipped"; title += " · folded into a later pull (the run came late)"; }
      else if (s.status === "saved") { cls = "skipped"; label += " saved"; title += " · left out to keep odds credits for the pulls an hour before kickoff (credits are short this month)"; }
      else if (now - t > 45 * 60000) { cls = "late"; label += " late"; title += " · not pulled yet: the next ticker beat serves it"; }
      else if (t === nextAt) { cls = "next"; label += " next"; }
      box.append(el("span", { class: `chip ${cls}`.trim(), title }, label));
    }
  }
}

// every A-grade pick still to kick off, at DraftKings, in one slip: the owner's one-click parlay of the A board
function aGradeSlip(all) {
  const now = Date.now();
  const isPick = (b) => b.pick === "Over" || b.pick === "Under";
  const aPicks = all.filter((b) => isPick(b) && b.grade === "A" && (!betKick(b) || betKick(b).getTime() > now));
  const seen = new Set(), legs = [];
  for (const a of aPicks.sort((x, y) => (y.lock ?? 0) - (x.lock ?? 0))) {
    const k = `${a.player}|${a.market}`; if (seen.has(k)) continue;
    // the same selection at DraftKings (its price, its slip id), whichever book has the best price
    const dk = all.find((b) => b.book === "DraftKings" && b.player === a.player && b.market === a.market && +b.line === +a.line && (b.side || b.pick) === (a.side || a.pick));
    const href = dk && sideLink(dk, dk.side || dk.pick);
    if (!dk || !href || !DK_RE.test(href)) continue;
    seen.add(k); legs.push({ ...dk, href, side: dk.side || dk.pick, p: dk.p_claim ?? (dk.side === "Under" ? 1 - dk.model_over : dk.model_over) });
  }
  if (legs.length < 2) return null;
  const slip = tailLink(legs.map((l) => l.href)); if (!slip) return null;
  const dec = legs.reduce((t, l) => t * (decimalOf(l.side === "Under" ? l.under_odds : l.over_odds) || 1), 1);
  const amer = dec >= 2 ? `+${Math.round((dec - 1) * 100)}` : `-${Math.round(100 / (dec - 1))}`;
  const chance = legs.reduce((t, l) => t * (l.p || 0.5), 1);
  const games = new Set(legs.map((l) => l.event_id)).size;
  const wrap = el("div", { class: "parlay-box" }, el("h3", {}, `Every A pick at DraftKings · ${legs.length} legs · ${amer}`));
  wrap.append(el("p", { class: "note" }, `${legs.map((l) => `${l.player}${l.jersey != null ? ` #${l.jersey}` : ""} ${l.side} ${num(l.line)} ${(MARKET[l.market] || "").toLowerCase()} (${odds(l.side === "Under" ? l.under_odds : l.over_odds)})`).join(" · ")}.`));
  wrap.append(el("div", { class: "tail" }, el("a", { class: "bet-link", href: slip.href, target: "_blank", rel: "noopener noreferrer" }, `Open all ${legs.length} at DraftKings in one slip ↗`)));
  wrap.append(el("p", { class: "note" }, `The model's chance that every leg hits: ${pct(chance)} (the win chances multiplied; ${games} game${games === 1 ? "" : "s"}). A parlay of picks the model likes is still mostly a long shot: each A is a good bet on its own, and the slip opens as a parlay, so split it into singles there if you would rather. DraftKings may refuse two solo-tackle legs from one game in a parlay; drop one of them on the slip if it does. Re-built at every line pull until kickoff.`));
  return wrap;
}

// sleepers: the model's own number disagrees with the line by a margin that held in every live week (config.SLEEPER).
// Tracked on their own record, never a lock; most of the combined ones never clear the pick bars.
function sleeperBox(all) {
  const now = Date.now(), sum = DATA.results?.summary?.sleepers;
  const open = all.filter((b) => b.sleeper && (!betKick(b) || betKick(b).getTime() > now));
  const best = new Map();
  for (const b of open) {
    const k = `${b.player}|${b.market}|${b.sleeper}`, o = b.sleeper === "Over" ? b.over_odds : b.under_odds, cur = best.get(k);
    const better = (x, y) => { const lx = x.sleeper === "Over" ? -x.line : +x.line, ly = y.sleeper === "Over" ? -y.line : +y.line;   // the best line first, then the best price
      return lx !== ly ? lx > ly : (x.sleeper === "Over" ? x.over_odds : x.under_odds) > (y.sleeper === "Over" ? y.over_odds : y.under_odds); };
    if (o != null && (!cur || better(b, cur))) best.set(k, b);
  }
  const gOrd = { A: 0, B: 1, C: 2 };
  const rows = [...best.values()].sort((a, b) => (gOrd[a.sleeper_grade] ?? 3) - (gOrd[b.sleeper_grade] ?? 3) || (b.sleeper_p ?? 0) - (a.sleeper_p ?? 0));
  if (!rows.length && !(sum && sum.all && sum.all.bets)) return null;
  const rec = (r) => (r && (r.wins + r.losses) ? `${r.wins}-${r.losses}${r.pushes ? "-" + r.pushes : ""} (${pct(r.hit)}), ${r.units >= 0 ? "+" : ""}${num(r.units, 1)}u` : "no graded games yet");
  const counts = ["A", "B", "C"].map((g) => [g, rows.filter((b) => b.sleeper_grade === g).length]).filter(([, n]) => n);
  const wrap = el("details", { class: "parlay-box sleepers", open: rows.length ? "" : null },
    el("summary", {}, el("strong", {}, `Sleepers · ${rows.length} open`), counts.length ? ` (${counts.map(([g, n]) => `${n} ${g}`).join(", ")})` : "", sum && sum.all && sum.all.bets ? ` · record ${rec(sum.all)}` : ""));
  const byG = sum && sum.by_grade ? ["A", "B", "C"].filter((g) => sum.by_grade[g]).map((g) => el("span", { class: "gchip" }, el("span", { class: `grade ${g}` }, g), rec(sum.by_grade[g]))) : [];
  if (byG.length) wrap.append(el("div", { class: "grade-chips note" }, "Record by grade: ", ...byG));
  wrap.append(el("p", { class: "note" }, "A second, simpler test kept on its own record: lines where the model's own number disagrees with the book's line by a margin that held in every week tracked (solo tackles with the model half a tackle or more under the line and his own season within a tackle of it; combined tackles with the model half a tackle to a tackle over). The sleeper grade comes from the model's own evidence and never looks at the price, so a sleeper can be a likely hit at a price that is not worth betting: each one says what the pricing engine makes of it at its price. The rules are frozen so the record can judge them. Never a lock; tracked at 1 unit each. In weeks 7 to 9 at the close: A 21-3, B 35-12, C 33-17 (chosen on those same weeks, so expect less)."));
  wrap.append(sleeperMath());
  // this week's settled sleepers, graded: what each grade actually did
  const wk = DATA.meta?.week, settled = (DATA.results?.sleepers || []).filter((r) => r.week === wk && ["Win", "Loss", "Push"].includes(r.result));
  if (settled.length) {
    const w = settled.filter((r) => r.result === "Win").length, l = settled.filter((r) => r.result === "Loss").length;
    const sd = el("details", { class: "legend" }, el("summary", {}, `Settled this week: ${w}-${l}`));
    for (const r of settled.sort((a, b) => (gOrd[a.sleeper_grade] ?? 3) - (gOrd[b.sleeper_grade] ?? 3)))
      sd.append(el("div", { class: "note" }, el("span", { class: `grade ${r.sleeper_grade || "C"}` }, r.sleeper_grade || "?"),
        `${r.player} ${r.side} ${num(r.line)} ${(MARKET[r.market] || "").toLowerCase()} (${odds(r.odds)}): ${r.actual == null ? "" : num(r.actual, 0)} · `, el("strong", { class: r.result === "Win" ? "ok" : r.result === "Loss" ? "no" : "" }, r.result)));
    wrap.append(sd);
  }
  for (const b of rows) {
    const side = b.sleeper, o = side === "Over" ? b.over_odds : b.under_odds, isPick = b.pick === side;
    wrap.append(el("div", { class: "sleeper-row" },
      el("div", {}, el("span", { class: `grade ${b.sleeper_grade || "C"}`, title: "Sleeper grade" }, b.sleeper_grade || "?"), el("strong", {}, `${b.player}${b.jersey != null ? ` #${b.jersey}` : ""}`), ` ${b.team || ""}${b.opp ? " vs " + b.opp : ""} · `, el("strong", {}, `${side} ${num(b.line)} ${(MARKET[b.market] || "").toLowerCase()}`), ` ${odds(o)} at ${b.book}`),
      el("div", { class: "note sleeper-sum" }, b.sleeper_note || `Model ${num(b.proj_model, 1)} vs line ${num(b.line)}.`),
      (() => {   // the price check: the chance this price needs to break even, against the model's own chance (shown, never part of the grade)
        const be = toDec(o) ? 1 / toDec(o) : null, short = be != null && b.sleeper_p != null && b.sleeper_p < be;
        return el("div", { class: "note" }, `${b.sleeper_p != null ? `Model's own chance ${pct(b.sleeper_p)}` : ""}${be != null ? ` vs ${pct(be)} to break even at ${odds(o)}` : ""}`,
          short ? el("strong", { class: "no" }, " · the price is too short for this chance: a likely hit, a losing bet") : "",
          `${isPick ? ` · also a ${b.grade || ""} pick on the board` : b.tier === "lean" && b.side === side ? " · a lean on the board (not staked)" : " · not a pick on the board"}${betKick(b) ? ` · ${when(b.commence_time)}` : ""}`);
      })(),
      el("div", { class: "tail" }, betLink(b, side), addButton(b))));
  }
  return wrap;
}

// the sleepers' math, in full, for anyone who wants to check it
function sleeperMath() {
  const P = (t) => el("p", {}, t), L = (...items) => el("ul", {}, ...items.map((t) => el("li", {}, t)));

    el("h4", {}, "1. The model's own number"),
    P("For every defender the model projects tackles from his own data: 60% from his tackles per game this season (shrunk toward last season or his position), 40% from his tackles per defensive snap times the share of snaps he is expected to play times the snaps his defence is expected to be on the field. Then the game factors that pass their test each morning (the opponent's expected volume, the spread, the depth chart, coverage targets, indoors for corners, a regular out at his position). A second model (gradient boosting, trained every morning on every defender-game since 2023) takes 60% of the final number. Solo tackles: that number times his solo share (his solo tackles over his total, shrunk toward his position's share). The result is μ, the model's own number. The pricing engine weighs the chance μ gives against the book's fair price to make the board's picks; the sleeper rule looks at μ against the line alone."),
    el("h4", {}, "2. From a number to a chance"),
    P("Tackles are counts, so the model treats them as a negative binomial with mean μ and variance φ·μ, where φ (the spread, measured per position on 28,000+ games) is about 1.2 for solo tackles; φ = 1 would be Poisson. The model's own chance of a side is a sum over that distribution: for an Under at a line L, P(X ≤ ⌊L⌋) = P(X=0) + P(X=1) + … + P(X=⌊L⌋); for an Over, 1 minus that. Worked example: μ = 2.5 solo tackles, φ = 1.2, line 3.5: P(3 or fewer) = 75%. At μ = 3.6 against 4.5 it is 70%. A combined Over at μ = 6.3, φ = 1.3, line 5.5: P(6 or more) = 58%. On the sleepers of weeks 7 to 9 this chance ran conservative: solo Unders averaged a 69% model chance and hit 82%; combined Overs averaged 56% and hit 67%. The grades lean on it as an ordering (A sleepers averaged 71%, B 63%, C 57%), not as a promise."),

    el("h4", {}, "4. Grades (the model's own evidence; the price never enters)"),

      "B: steady, without either A condition (solo), or a combined Over with a 57%+ model chance. Weeks 7-9: 35-12.",
      "C: passes the sleeper rule but the role is not settled, or a combined Over under 57%. Weeks 7-9: 33-17.",
      "Combined Overs top out at B until their own record earns an A."),
    el("h4", {}, "5. What these numbers cannot promise"),
    L("The cuts and grades were chosen on the same three weeks they are scored on. The live record will be lower, the A rate most of all. Judge them on the record by grade above, not on 21-3.",

      ["Hit rate", "Wins divided by wins plus losses (pushes and voids left out). The break-even hit rate at −110 is 52.4%, so a 55% hit rate on −110 prices is a profit and a 51% one is a loss."],
      ["Return per bet (ROI)", "Units won or lost divided by bets made. +5% means five cents of profit for every dollar staked over the sample. The best sustained numbers in any market are single digits."],
      ["Parlay, same-game parlay", "Two or more legs that must all win; the payout multiplies the decimal odds, so the price is long and the chance is the product of the legs' chances (two 60% legs together hit 36%). A same-game parlay has legs from one game: the book prices it itself, under the product when the legs move together, and restricts which markets can go in one, which is why the site's parlay is two combined-tackle legs and why its odds are marked as an estimate when both legs share a game. Every leg must be a pick in its own right."],
      ["Slip link", "The 'Bet at DraftKings' links on a pick or parlay open the book's app with that selection already on the slip. theScore Bet has no slip link: its lines come from the US theScore Bet feed (the former ESPN BET), whose links the Alberta app cannot open, so find the player in the app by hand, and check the price there, since the Alberta book can price differently. Prices there can differ from the ones pulled here; the pick stands on the price shown on the site."]]],
    ["The projection", [
      ["Projection (the model's own number)", "The model's expected tackles for the player in this game. Two views of him are blended: his tackles per game this season, and his tackles per defensive snap times the snaps he is expected to play. Game factors that pass their test every morning move it (the opponent's expected volume, the spread, the depth chart, coverage targets, indoors for corners, a regular out at his position), and a second model trained on every defender-game since 2023 takes " + pct(cw) + " of the final number. It is an average, not a prediction of one number: a 6.0 projection means 6 is the centre of a wide range."],
      ["Factor model, second model", "The factor model is the hand-built one: a base rate times a handful of game factors. The second model (gradient boosting) learns directly from every past game what the factor model and the raw signals together imply. Out of sample the blend beats either alone for the regulars who get lines, with the second model carrying " + pct(cw) + " of the number; the Model check tab shows both, season by season."],
      ["Game logic", "The row on a card that says what moved his number by 3% or more. Each figure is measured, not assumed: the projection is rebuilt with that one signal switched to neutral (his snap share back at his season share, the spread at zero, the teammate not out) and the difference is the signal's effect on the final number."],
      ["Fair line", "The half-point line the model puts closest to a coin flip for the player. Comparing it with the posted line is the quickest read of where the model and the market disagree."],
      ["Dispersion (spread)", "How wide the range around the projection is, as variance divided by mean. 1.0 is Poisson (the spread of a plain count); tackle counts run wider. It is fitted as the spread that makes the actual counts most likely around the projection the board prices with, by position, by whether he is a regular, and by market. It sets the chance of each side, so the same one-tackle gap is worth more on a tight player than a loose one."],
      ["Snap share, implied snap share", "The share of the defence's plays he was on the field for. His tackles scale with it, so a role change moves the projection more than anything else. The implied snap share in a pick's rundown is the share he would have to play for the posted line to be the fair line: an easy sanity check against his recent games."],
      ["Stat crew", "The home stadium's scorekeepers, who decide what counts as a tackle and an assist. A crew's tendency in one season says little about the next (it was dropped as a factor in November 2026 after failing its test); the second model still sees it and can use what is real in it."],
      ["The model's own chance", "The chance of a side from the model's own number and spread alone, with no look at the book. It is the model's evidence in its purest form, and it overstates: the model taken whole predicts worse than the book's price. It is one of the two numbers a grade is built from, and it is the lock score."],
      ["The book's fair chance", "The book's own estimate of the same chance: its price on both sides of the line with its margin taken out. When two books post the same line their fair chances are averaged; a one-sided price is priced against the books that quote both sides."],
      ["Win chance", "The one probability the site stands behind for a line: the book's fair chance moved " + pct(e.beta) + " of the way to the model's own chance (measured in odds). When the model and the book agree it is the fair chance, so agreement never makes a pick; the model's disagreement is counted at half its size because that is what it has been worth (the Track record tab's \"Against the market\" keeps testing it)."],
      ["Cautious chance", "The win chance moves the book's fair chance " + WEIGHTS() + ". The cautious chance is the same calculation with the disagreement counted at half of that: what the win chance would be if the model's view is worth half of what we think. A pick has to pay for itself even then."],
      ["Calibration (said vs hit)", "Whether chances come true at the rate stated. A group of lines given 58% that wins 58% is calibrated; one that wins 50% overclaims by 8 points. The Track record tab shows it for the win chance on every closing line, picked or not."]]],
    ["Choosing picks", [
      ["Return at the win chance (EV)", "Profit per unit staked if the win chance is right: win chance x what a win pays, minus the chance of losing. A 58% win chance at −110 is +10.7%."],
      ["Cautious edge", "The same return at the cautious chance. It is the test a line must pass: zero or better and it is a pick, " + signedPct(e.b_edge_low) + " or better and it is at least a B. It can only shrink when the book's price moves toward the model, which is why the grade is built on it."],
      ["Pick, lean, no pick", "A pick has a cautious edge of zero or better. A lean has a return of " + signedPct(e.lean_edge) + " or more at the win chance but is under water at the cautious one: it is shown and logged so it can be judged later, and never staked (at the close in weeks 7 to 9, leans went 72-68). Everything else is no pick; the board still shows both opinions on it."],
      ["Sleeper", "A second, simpler rule kept on its own record: a line where the model's own number disagrees with the book's line by a margin that held in every week tracked (solo tackles with the model half a tackle or more under the line and his season median within a tackle of it; combined tackles with the model half a tackle to a tackle over). Graded A, B or C from the model's own chance, his role and the game's volume; never the price, so a sleeper can be a likely hit and a poor bet. Each sleeper says what the pricing engine makes of it at its price. The rules are frozen, 1 unit each, never a lock. The full math is in the Sleepers box on the Plays tab."],
      ["Lock score", "The model's own chance of the pick's side, out of 100. It never uses whether the book agrees. It ranks the locks, and an A needs " + Math.round(bars.A ?? 70) + " or better."],
      ["Grade (A, B, C)", e.a_rule === "hole" ? `A: a solo Under pick on a line the book has set at ${pct(HOLE())} or more of its own combined line for the same player, that is also a sleeper, with a clear lock checklist. B: any other solo Under pick on such a line. C: every other pick. A book's own two lines disagreeing is not the book agreeing with us: it is where the book is most often wrong. The Track record tab tests whether A beats B beats C.` : (e.a_rule === "sleeper" ? "A: a pick that is also a sleeper on the same side (the price pays at the cautious chance, and the model's number sits clear of the line by the sleeper margin), with a clear lock checklist. B:" : "A: a cautious edge of " + signedPct(e.b_edge_low) + " or more, the model's own chance at " + pct(e.a_model) + " or more, and a clear lock checklist. B:") + " a cautious edge of " + signedPct(e.b_edge_low) + " or more. C: a pick short of that. Both numbers behind a grade can only get worse when the book moves toward us, so a grade is never earned by agreeing with the book. The Track record tab tests whether A beats B beats C."],
      ["Lock", "A pick the model strongly believes in: an A, highest model chance first. There are at most a few per slate day, and a day with no A has no lock, because a lock is never the best of a thin board. Locks are the green-edged cards and the 'Locks' record on the Track record tab."],
      ["Lock-eligible, the checklist", "The situations in which the model is biased or blind, so a pick can never be a lock, an A or a parlay leg whatever its numbers: a new or reduced role, the next man up when a regular is out (and his Under is not a pick at all when the model does not expect him to play much), back from absence, first game for a new team, fewer than three games in his current role, listed questionable, missing snap counts, or an Over. Each is a tag on the card; the pick can still be played at its grade."],
      ["An A in yellow", "A card's left edge is yellow when it is a pick and green when it is a lock. An A-grade pick with a yellow edge is an A that is not a lock: the slate already has its allowed number of locks, or two of its kind."],
      ["Stake, slate sizing", "Each pick starts at a quarter of the Kelly stake at its cautious chance, so a pick that only just passes gets the minimum. Then the day's picks are sized as one book, because they are not independent bets: the solo Unders of one Sunday win and lose as a group. Stakes are divided for the number of picks of the same kind that day and scaled to stay under a cap per game, per kind and per day."],
      ["Kelly stake", "The stake that grows a bankroll fastest for a known edge: the edge divided by what a win pays. Because the edge is never known exactly, a fraction of it is used (here a quarter, at the cautious chance)."],
      ["Consistency", "How often he has landed on this side of this line in his games this season, read at the snap share he is expected to play. Shown on the card for the eye. It is in no score: once the projection is known it adds nothing to the chance (tested on every closing line of weeks 7 to 9)."],
      ["Thin", "Fewer than three games of data. A thin line is never a pick."],
      ["Tags", "The short labels on a card: role changes (New role, Reduced role, Promoted, Demoted, Back from absence, New team, Teammate gone), the injury report (Questionable, Opp QB out), a lineman's pressure profile (Run-stuffer, Interior, Pass rusher, a read of the line, not a model adjustment), Lean, and Model far from line (the model's own number and the market are 25%+ apart, so one of them knows something). Hover a tag for its rule."],
      ["Rundown", "The paragraph in the 'Why' box under every priced line: who he is, his last games, the model's chance against the book's fair chance and what each is worth at the price, the implied snap share, his game log at this line, and the role and injury context. Written from the pricer's own numbers, so it is always the same read the grade is."],
      ["Consensus (FantasyPros)", "An outside expert projection, shown relative to its usual relation with this model (it runs about a quarter above box scores, so its raw number means little). For comparison only: it never prices, grades or chooses a pick."],
      ["Best price per line", "Books post the same line at different prices. With the box ticked the board shows each line once at its best price; untick it to see every book. The book filter narrows the board to one book's lines."]]],
    ["Judging the record", [
      ["Closing line", "The last line and price before kickoff, with everything the market knows priced in. It is the best single estimate of the true chance available, better than the result of one game, which is mostly luck."],
      ["Beat the close", "Among picks whose closing number differed from the one we took, the share that moved our way (a better line, or the same line at a price that moved toward our side). Picks whose number never moved are left out. " + pct(cl.decent) + " or below is noise, " + pct(cl.good) + " and up is what sharp bettors sustain, " + pct(cl.great) + " and up is rare."],
      ["No-vig CLV (closing-line value, in points)", "The measure bettors quote: the fair (no-vig) closing chance of our side minus the chance implied by the price we took, averaged over every pick with a closing price, in probability points. A −110 price that closes unchanged scores −2.4 (the vig). " + signedPct(cp.good) + " to " + signedPct(cp.excellent) + " sustained is good, " + signedPct(cp.excellent) + " to " + signedPct(cp.elite) + " excellent, above " + signedPct(cp.elite) + " elite and short-lived. When the line itself moved, the closing price is carried to our line through the market's own expected tackles. Tackle lines rarely move, so most picks score near the vig and the few that move drive the average."],
      ["Against the market (log-loss)", "The scoreboard that can say whether the edge is real. Every closing line the model had a number for, picked or not, is scored twice: with the chance the book's own closing price gave it, and with the win chance. Log-loss punishes a confident wrong chance heavily and rewards an honest one; lower is better and a coin flip scores 0.693. If the win chance keeps scoring better than the book's price, with weeks as the unit, the model knows something the price does not. A record needs most of a season to say the same thing."],
      ["Likely range", "Where the true hit rate behind a record plausibly sits (a 95% interval). 10-4 looks like 71%, but with fourteen bets the truth could be anywhere from the mid 40s to the high 80s. The range also allows for the fact that a week's picks win and lose together, which makes a record worth fewer bets than it counts. Two records whose ranges overlap have not been told apart."],
      ["Weeks as the unit", "The picks of one week are not independent: every solo Under on the board won 68%, 64% and 53% in weeks 7, 8 and 9, far more spread than luck on separate bets allows. So anything measured on this site (a factor, a rule, the scoreboard) is judged by how it does week after week, not by counting picks."],
      ["Settled once", "A pick settles on the first final box score that grades it and the result is then frozen, as at the book, which does not reopen a bet for a later stat correction. Corrections to the official count are counted and shown, never applied to the record; the model itself always learns from the corrected stats."],
      ["Claimed edge vs the price", "The win chance minus the book's implied chance at the price taken, averaged over a slice: the edge we said we had."],
      ["Realised edge vs the price", "The slice's hit rate minus the book's average implied chance on it: the edge that actually showed up. The gap between claimed and realised is the overclaim; read it per slice, because it differs by side, market and position."],
      ["Whole board, market base rate", "How every closing line of a kind resolved, picked or not: if 74% of all Unders on the board hit in a week, a 74% hit rate on our Unders was the market, not the model."],
      ["Lift over the board", "Our hit rate on a kind of pick minus the whole-board rate for that kind: what choosing these lines added. A kind of pick is evidence for the model only where lift and beating the close agree with the record."],
      ["Luck or skill (the luck table)", "The weekly table that puts hit rate, the whole-board rate, lift and beat-the-close side by side, with a verdict: 'we picked well' when the lift is real, 'the market went our way' when the board as a whole resolved our way, and a note when there were too few picks to say. Every post-mortem starts from it."],
      ["Segment (kind of pick)", "Side × market × position (Under combined LB, Over solo CB and so on). The record is read per kind, because the model is not equally right everywhere, and no more than two locks or parlay legs of one kind are taken a day. Until week 10 the claimed chance was also corrected per kind; the correction flipped sign week to week and was retired."],
      ["Market watch", "Every closing line on the board, not just our picks: how often the over hit against what the market's own price implied. It says whether the market itself was biased that week."],
      ["Backtest, miss, deviance", "On the Model check tab. Every past defender-game predicted using only what was known before it. 'Miss' is the average error in tackles; 'deviance' is the proper score for an average and the one a piece of the model is judged on. The final projection is scored season by season with its second model trained on earlier seasons only: the honest number. Every factor is re-tested each morning on the games it moves; one that stops earning its place is flagged for the full test."],
      ["Walk-forward", "Scoring a model only on games after everything it learned from. In-sample numbers (scored on the games it trained on) flatter a model several times over; nothing on this site is reported in-sample without saying so."]]],
    ["My board", [
      ["Live and official", "While a game is on, a bet on My board is tracked from ESPN's live box score; the morning after, the official stat line confirms it. The two can differ by an assist here and there. The site's own record settles a pick once, on the first final box score (see Settled once)."],
      ["On current pace (heading for)", "Where his total is headed: what he has so far plus the model's expected tackles for the part of the game left (the projection already counts the snaps he should play), nudged a little by his rate today. Early tackles say little about the rest of a game, so one tackle in the first quarter moves the estimate by about a tackle, not to twelve. With the money that would mean. A read, not a promise: a player hurt mid-game keeps his estimate until the box score shows it."],
      ["In play", "Money counts toward the day's total only once the game has kicked off, because a bet can still be withdrawn before then. The unstarted column shows what is queued."],
      ["Ledger", "Every week's board kept on this device, with the official result and the grade on each bet, and the running total for the season. Closed weeks fold away; clearing the board archives the week, it never deletes it. Back it up: the ledger lives in the browser only."]]]];
}
let GLOSS_Q = "";
function renderGloss() {
  const box = $("#gloss-body"); if (!box) return;
  box.replaceChildren();
  const wrap = el("div", { class: "gloss" });
  wrap.append(el("p", { class: "lead" }, "What the words on this site mean, from the bet itself to how the record is judged. The thresholds quoted are the live ones from the model's settings."));
  const q = el("input", { type: "search", placeholder: "Search a term", value: GLOSS_Q, "aria-label": "Search the glossary" });
  q.addEventListener("input", () => { GLOSS_Q = q.value; renderGloss(); const n = $("#gloss-body input"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } });
  wrap.append(el("div", { class: "controls" }, q));
  const groups = glossTerms(), needle = GLOSS_Q.trim().toLowerCase();
  const hit = (t, d) => !needle || t.toLowerCase().includes(needle) || d.toLowerCase().includes(needle);
  const mark = (text) => { if (!needle) return text; const out = [], re = new RegExp(needle.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"); let last = 0, m; while ((m = re.exec(text))) { out.push(text.slice(last, m.index), el("mark", {}, m[0])); last = m.index + m[0].length; } out.push(text.slice(last)); return out; };
  if (!needle) wrap.append(el("div", { class: "toc" }, ...groups.map(([h]) => { const a = el("a", { href: "#gloss" }, h); a.onclick = (e) => { e.preventDefault(); const t = wrap.querySelector(`[data-group="${h}"]`); if (t) t.scrollIntoView({ behavior: "smooth", block: "start" }); }; return a; })));
  let shown = 0;
  for (const [h, terms] of groups) {
    const rows = terms.filter(([t, d]) => hit(t, d)); if (!rows.length) continue;
    const dl = el("dl", {});
    for (const [t, d] of rows) { dl.append(el("dt", {}, ...mark(t)), el("dd", {}, ...mark(d))); shown++; }
    wrap.append(el("h3", { "data-group": h }, h), dl);
  }
  if (!shown) wrap.append(el("div", { class: "empty" }, "No term matches."));
  box.append(wrap);
}

function show(id) {
  for (const s of ["plays", "proj", "record", "check", "mine", "patch", "gloss", "ast"]) { $("#" + s).hidden = s !== id; }
  if (id === "mine") renderMine();
  document.querySelectorAll("nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === id)));
  history.replaceState(null, "", "#" + id);
}

(async () => {
  [DATA.meta, DATA.bets, DATA.proj, DATA.results, DATA.backtest, DATA.parlays, DATA.week_lines, DATA.patch, DATA.actuals] = await Promise.all(["meta", "bets", "projections", "results", "backtest", "parlays", "lines_week", "patchlog", "actuals"].map(load));
  renderMeta(); renderPlays(); renderDaybar(); renderProj(); renderRecord(); renderCheck(); renderPatch(); renderGloss(); renderAssists();
  ["#ast-book", "#ast-side", "#ast-sort", "#ast-picks-only", "#ast-best-only"].forEach((s) => $(s).addEventListener("change", renderAssists));
  ["#picks-only", "#market", "#best-only", "#slate", "#pos", "#side", "#sort", "#book"].forEach((s) => $(s).addEventListener("change", renderPlays));
  $("#q").addEventListener("input", renderProj);
  $("#proj-slate").addEventListener("change", renderProj);
  document.querySelectorAll("nav button").forEach((b) => b.addEventListener("click", () => show(b.dataset.tab)));
  if (location.hash.startsWith("#import=")) { await importFromHash(); show("mine"); }
  const h = location.hash.slice(1); if (["plays", "proj", "record", "check", "mine", "patch", "gloss", "ast"].includes(h)) show(h);
  renderMine(); liveLoop();
})();
</script>
